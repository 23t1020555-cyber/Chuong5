<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
  {% block styles %}
  <style>
    /* Bảng màu cam - đen.
       (Giữ nguyên tên biến cũ để các template khác không phải sửa:
        --plum = đen nền, --gold = cam nhấn, --gold-deep = cam đậm cho chữ) */
    :root {
      --ink: #121212;
      --plum: #1c1c1c;
      --plum-soft: #fff1e3;
      --gold: #ff7a00;
      --gold-deep: #b34700;
      --paper: #fbfaf8;
      --line: #e6ded5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Be Vietnam Pro", system-ui, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.6;
    }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }

    /* Đầu trang */
    .site-header { background: var(--plum); color: #fff; border-bottom: 3px solid var(--gold); }
    .site-header .wrap {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px 16px; padding-top: 14px; padding-bottom: 14px;
    }
    .brand { font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; text-decoration: none; }
    .site-header nav a {
      margin-left: 20px; padding: 6px 0; text-decoration: none;
      color: #e6e6e6; border-bottom: 2px solid transparent;
    }
    .site-header nav a:hover,
    .site-header nav a.active { color: #fff; border-bottom-color: var(--gold); }

    /* Nút */
    .btn {
      display: inline-block; padding: 11px 22px; border-radius: 4px;
      border: 2px solid var(--gold); font-weight: 600; text-decoration: none;
    }
    .btn-primary { background: var(--gold); color: var(--ink); }
    .btn-primary:hover { background: #ff9433; }
    .btn-ghost { color: #fff; margin-left: 8px; }
    .btn-ghost:hover { background: rgba(255, 255, 255, .1); }

    /* Trang chủ */
    .hero { background: var(--plum); color: #fff; padding: 72px 0 84px; }
    .hero h1 {
      margin: 0 0 20px; font-weight: 800; line-height: 1.02;
      letter-spacing: -.03em; font-size: clamp(2.6rem, 9vw, 5.2rem);
    }
    .hero p { max-width: 34ch; margin: 0 0 28px; font-size: 1.15rem; color: #e6e6e6; }

    /* Khối thông tin dùng chung */
    .info {
      display: grid; gap: 32px; padding: 40px 0 8px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }
    .info h2 { margin: 0 0 4px; font-size: 1rem; color: var(--gold-deep); }
    .info p { margin: 0; }
    .big { font-size: 1.5rem; font-weight: 600; }
    .page-title { margin: 48px 0 8px; font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: -.02em; line-height: 1.15; }

    /* Trang 404 */
    .notfound { padding-top: 24px; }
    .notfound .code { margin: 32px 0 0; font-size: 5.5rem; font-weight: 800; line-height: 1; color: var(--gold-deep); }
    .notfound .btn-primary { margin-top: 16px; }

    /* Chân trang */
    .site-footer { margin-top: 64px; padding: 24px 0; background: var(--ink); color: #c4c4c4; font-size: .95rem; }
    .site-footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 24px; }
    .site-footer p { margin: 0; }
  </style>
  {% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ url_for('index') }}">{{ shop.name }}</a>
      <nav>
        <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} class="active"{% endif %}>Trang chủ</a>
        <a href="{{ url_for('menu') }}"{% if request.endpoint == 'menu' %} class="active"{% endif %}>Thực đơn</a>
        <a href="{{ url_for('contact') }}"{% if request.endpoint == 'contact' %} class="active"{% endif %}>Liên hệ</a>
        <a href="{{ url_for('calc') }}"{% if request.endpoint == 'calc' %} class="active"{% endif %}>Máy tính</a>
        <a href="{{ url_for('grade') }}"{% if request.endpoint == 'grade' %} class="active"{% endif %}>Tính điểm</a>
        <a href="{{ url_for('bmi') }}"{% if request.endpoint == 'bmi' %} class="active"{% endif %}>BMI</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© {{ shop.name }}</p>
      <p>{{ shop.address }}</p>
    </div>
  </footer>
</body>
</html>
